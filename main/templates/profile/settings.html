{% extends "base.html" %}

{% block content %}
    <div>
        <p class="fs-3">Settings: <span>{{ profile.nickname }}</span></p>
        {% if form.errors %}
            <ul>
                {% for field, error in form.errors.items %}
                    <li>{{ field }}: {{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <form>
            {% csrf_token %}
            <div class="container text-center">
                <div class="row my-2">
                    <label class="col" for="login">
                        Login
                    </label>
                    <div class="col-10">
                        <input id="login" class="form-control" type="text" value="{{ user.username }}">
                    </div>
                </div>
                <div class="row my-2">
                    <label class="col" for="email">
                        Email
                    </label>
                    <div class="col-10">
                        <input id="email" class="form-control" type="text" value="{{ user.email }}">
                    </div>
                </div>
                <div class="row my-2">
                    <label class="col" for="nickname">
                        NickName
                    </label>
                    <div class="col-10">
                        <input id="nickname" class="form-control" type="text" value="{{ profile.nickname }}">
                    </div>
                </div>
                <div class="row my-2">
                    <label class="col" for="avatar">
                        <img src="{{ profile.avatar.url }}" alt="avatar">
                    </label>
                    <div class="col-10 align-self-center">
                        <input id="avatar" class="form-control" type="image" alt="avatar">
                    </div>
                </div>
            </div>
            <input class="btn btn-secondary" type="submit" value="Save">
        </form>
    </div>
{% endblock %}
