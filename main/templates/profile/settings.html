{% extends "base.html" %}

{% block content %}
    <div>
        <p class="fs-3">Settings: <span>{{ profile.nickname }}</span></p>
        {% if form.errors %}
            <ul>
                {% for field, error in form.errors.items %}
                    <li>{{ field }}: {{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="container text-center">
                {% for field in form %}
                    <div class="row my-2">
                        <label class="col" for="login">
                            {{ field.label }}
                        </label>
                        <div class="col-10">
                            {{ field }}
                        </div>
                    </div>
                {% endfor %}
            </div>
            <input class="btn btn-secondary" type="submit" value="Save">
        </form>
    </div>
{% endblock %}
