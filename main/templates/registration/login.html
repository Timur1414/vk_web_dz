{% extends "base.html" %}

{% block content %}
    <p>Log in</p>
    {% if form.errors %}
        <p>Your username and password didn't match. Please try again.</p>
    {% endif %}
    <form>
        {% csrf_token %}
        <div class="container text-center">
            <div class="row my-2">
                <label class="col" for="login">
                    Login
                </label>
                <div class="col-10">
                    <input id="login" class="form-control" type="text">
                </div>
            </div>
            <div class="row my-2">
                <label class="col" for="password">
                    Password
                </label>
                <div class="col-10">
                    <input id="password" class="form-control" type="password">
                </div>
            </div>
        </div>
        <input class="btn btn-secondary" type="submit" value="Log in">
    </form>
    <a>create new account</a>
{% endblock %}
