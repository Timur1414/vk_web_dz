{% load custom_filters %}
{% load humanize %}

<div class="question_card border rounded border-info border-3 container row mb-2 py-1" onclick="open_card({{ question.id }})">
    <div class="col my-auto">
        <img class="img-fluid rounded" style="max-width: 100px; max-height: 100px;" src="{{ question.author.profile.avatar.url }}" alt="avatar">
        <p class="m-0 p-0"><span class="fs-4">👍</span>: {{ question.rating }}</p>
        <p>answers: {{ question.count_answers }}</p>
    </div>
    <div class="col-10">
        <p class="fs-4 text-truncate">{{ question.title }}</p>
        <div style="height: 8vh; overflow: hidden">
            <p class="text-truncate">{{ question.text|safe }}</p>
        </div>
        <div class="row mt-4 px-0">
            <div class="col-7 text-truncate">
                <span class="fw-semibold">Tags: </span>
                {% for tag in question.tags.all %}
                    <span class="tag rounded px-1 text-{{ tag.color }}" onclick="open_tag(event, '{{ tag.text }}')">{{ tag }}</span>
                {% empty %}
                    <span>nothing...</span>
                {% endfor %}
            </div>
            <div class="col">
                <p class="text-end">Created {{ question.created_at|naturaltime }}</p>
            </div>
        </div>
    </div>
</div>
