<a class="text-decoration-none text-dark" href="{% url 'question' id=question.id %}">
    <div class="border border-dark border-3 container row mb-5">
        <div class="col">
            <img src="{{ question.author.profile.avatar.url }}" alt="avatar">
            <p>{{ question.rating }}</p>
        </div>
        <div class="col-9">
            <p>{{ question.title }}</p>
            <p class="text-truncate">{{ question.text }}</p>
            <div class="row mt-4">
                <div class="col">
                    <p>answer</p>
                </div>
                <div class="col-9 text-truncate">
                    <span>Tags: </span>
                    {% for tag in question.tags.all %}
                        <span>{{ tag }}</span>
                    {% empty %}
                        <span>nothing...</span>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</a>
