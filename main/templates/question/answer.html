<div class="border border-dark border-3 container row mb-5 mx-2">
    <div class="col">
        <img src="{{ answer.author.profile.avatar.url }}" alt="avatar">
        <button>{{ answer.rating }}</button>
    </div>
    <div class="col-10">
        <p>{{ answer.text }}</p>
        {% if question.author == request.user %}
            <div class="form-check">
                <label class="form-check-label" for="correct">
                    Correct
                </label>
                <input class="form-check-input" type="checkbox" value="" id="correct" {% if answer.is_correct %}checked{% endif %}>
            </div>
        {% endif %}
    </div>
</div>
