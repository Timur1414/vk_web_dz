name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.7, 3.8, 3.9, 3.10, 3.12]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test
    - name: Bandit
      run: |
         bandit -c bandit.yml -o bandit_report.txt -f txt -r .
    - name: Pylint
      run: |
        pylint --disable=C0114,R0903,C0116,C0115,R0901,C0415,C0301 **/*.py --output=pylint_report.txt
    - name: Upload bandit artifacts
      uses: actions/upload-artifact@v3
      with:
        name: bandit_report
        path: bandit_report.txt
        retention-days: 30
    - name: Upload pylint artifacts
      uses: actions/upload-artifact@v3
      with:
        name: pylint_report
        path: pylint_report.txt
        retention-days: 30
