name: Django CI

on:
  push:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]
    env:
      SECRET_KEY: 'secret-key-for-testing-12345'
      DEBUG: 'False'
      DJANGO_SETTINGS_MODULE: 'vk_dz.settings'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test
    - name: Bandit
      run: |
         bandit -c bandit.yml -o bandit_report.txt -f txt -r .
      continue-on-error: true
    - name: Pylint
      run: |
        pylint **/*.py --output=pylint_report.txt
      continue-on-error: true
    - name: Upload bandit artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bandit_report
        path: bandit_report.txt
        retention-days: 30
    - name: Upload pylint artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pylint_report
        path: pylint_report.txt
        retention-days: 30
